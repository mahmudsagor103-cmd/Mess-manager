<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>মেস ম্যানেজার</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0E1512;
    --panel: #16201C;
    --panel-2: #1C2822;
    --line: rgba(214,201,168,0.14);
    --gold: #C9A24B;
    --gold-soft: rgba(201,162,75,0.16);
    --teal: #3FAE8C;
    --teal-soft: rgba(63,174,140,0.16);
    --red: #D9705C;
    --red-soft: rgba(217,112,92,0.14);
    --text: #F2ECDD;
    --text-dim: #A7A296;
    --text-dimmer: #706C61;
    --radius: 18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color: var(--text);
    font-family:'Hind Siliguri', sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }
  h1,h2,h3,.display{ font-family:'Fraunces', serif; }

  /* ambient background */
  .orb{
    position:fixed; border-radius:50%; filter: blur(70px); opacity:0.35; pointer-events:none; z-index:0;
    animation: drift 22s ease-in-out infinite;
  }
  .orb1{ width:420px; height:420px; background: var(--teal); top:-140px; left:-120px; animation-delay:0s;}
  .orb2{ width:380px; height:380px; background: var(--gold); bottom:-160px; right:-100px; animation-delay:-8s;}
  @keyframes drift{
    0%,100%{ transform: translate(0,0) scale(1); }
    50%{ transform: translate(40px,-30px) scale(1.08); }
  }
  @media (prefers-reduced-motion: reduce){ .orb{animation:none;} }

  .app{ position:relative; z-index:1; max-width:1100px; margin:0 auto; padding:20px 16px 80px; }

  /* ---- Gate / Login ---- */
  .gate{
    min-height:100vh; display:flex; align-items:center; justify-content:center; position:relative; z-index:1; padding:20px;
  }
  .gate-card{
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border:1px solid var(--line); border-radius:24px; padding:38px 30px; width:100%; max-width:380px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.45);
  }
  .gate-eyebrow{ color:var(--teal); font-size:13px; letter-spacing:0.3px; margin-bottom:6px; }
  .gate-title{ font-size:30px; font-weight:600; margin:0 0 6px; }
  .gate-sub{ color:var(--text-dim); font-size:14.5px; margin:0 0 26px; line-height:1.6;}
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:13px; color:var(--text-dim); margin-bottom:6px;}
  .field input, .field select, .field textarea{
    width:100%; background: rgba(255,255,255,0.03); border:1px solid var(--line); color:var(--text);
    border-radius:12px; padding:12px 14px; font-size:15.5px; font-family:inherit; outline:none;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ border-color: var(--teal); }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    background: var(--teal); color:#0E1512; border:none; border-radius:12px; padding:13px 18px;
    font-size:15.5px; font-weight:600; cursor:pointer; font-family:'Hind Siliguri',sans-serif;
    transition: transform .15s ease, filter .15s ease;
  }
  .btn:hover{ filter:brightness(1.08); transform: translateY(-1px); }
  .btn:active{ transform: translateY(0); }
  .btn.block{ width:100%; }
  .btn.gold{ background: var(--gold); }
  .btn.ghost{ background:transparent; border:1px solid var(--line); color:var(--text); }
  .btn.danger{ background: var(--red); }
  .btn.sm{ padding:9px 13px; font-size:13.5px; border-radius:10px;}
  .gate-toggle{ text-align:center; margin-top:16px; font-size:13.5px; color:var(--text-dim); }
  .gate-toggle a{ color: var(--gold); cursor:pointer; text-decoration:none; }
  .err{ color: var(--red); font-size:13px; margin-top:-6px; margin-bottom:12px; min-height:16px;}

  /* ---- Top bar ---- */
  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:6px 2px 22px; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-mark{ width:38px; height:38px; border-radius:10px; background: linear-gradient(135deg, var(--teal), var(--gold)); display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-weight:700; color:#0E1512; font-size:17px;}
  .brand-name{ font-family:'Fraunces',serif; font-size:19px; font-weight:600; }
  .brand-role{ font-size:11.5px; color:var(--text-dim); }
  .top-actions{ display:flex; gap:8px; align-items:center; }

  /* ---- Nav tabs ---- */
  .tabs{ display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; margin-bottom:22px; scrollbar-width:none; }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab{
    flex:0 0 auto; padding:9px 16px; border-radius:100px; font-size:14px; color:var(--text-dim);
    background: rgba(255,255,255,0.03); border:1px solid var(--line); cursor:pointer; white-space:nowrap;
    transition: all .15s ease;
  }
  .tab.active{ background: var(--teal-soft); color: var(--teal); border-color: rgba(63,174,140,0.4); font-weight:600; }

  .section-title{ font-size:22px; font-weight:600; margin:2px 0 4px; }
  .section-sub{ color:var(--text-dim); font-size:13.5px; margin:0 0 18px; }

  /* ---- Summary strip ---- */
  .stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-bottom:24px; }
  .stat{
    background: var(--panel); border:1px solid var(--line); border-radius:16px; padding:14px 16px;
  }
  .stat-label{ font-size:12px; color:var(--text-dim); margin-bottom:6px; }
  .stat-value{ font-family:'Fraunces',serif; font-size:22px; font-weight:600; }
  .stat-value.gold{ color:var(--gold); }
  .stat-value.teal{ color:var(--teal); }
  .stat-value.red{ color:var(--red); }

  /* ---- Member 3D cards ---- */
  .members-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(158px,1fr)); gap:14px; perspective:1200px; }
  .mcard{ height:210px; cursor:pointer; }
  .mcard-inner{
    position:relative; width:100%; height:100%; transition: transform .6s cubic-bezier(.4,.2,.2,1); transform-style:preserve-3d;
  }
  .mcard.flipped .mcard-inner{ transform: rotateY(180deg); }
  .mface{
    position:absolute; inset:0; backface-visibility:hidden; border-radius:18px; border:1px solid var(--line);
    background: var(--panel); padding:14px; display:flex; flex-direction:column;
  }
  .mface.front{ align-items:center; justify-content:center; text-align:center; }
  .mphoto{
    width:72px; height:72px; border-radius:50%; object-fit:cover; margin-bottom:10px; border:2px solid var(--gold-soft);
    background: var(--panel-2); display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-size:24px; color:var(--gold);
  }
  .mname{ font-weight:600; font-size:15px; margin-bottom:3px; }
  .mmini{ font-size:11.5px; color:var(--text-dim); }
  .mface.back{ transform: rotateY(180deg); justify-content:space-between; font-size:12.5px; }
  .mback-row{ display:flex; justify-content:space-between; padding:3px 0; border-bottom:1px dashed var(--line); }
  .mback-row span:last-child{ font-weight:600; }
  .mback-actions{ display:flex; gap:6px; margin-top:8px; }

  .add-card{
    height:210px; border-radius:18px; border:1.5px dashed var(--line); display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:8px; color:var(--text-dim); cursor:pointer; background:transparent;
  }
  .add-card:hover{ border-color:var(--teal); color:var(--teal); }
  .add-plus{ font-size:28px; }

  /* ---- Table-ish lists ---- */
  .list{ display:flex; flex-direction:column; gap:8px; }
  .row-card{
    background: var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px 14px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .row-left{ display:flex; align-items:center; gap:10px; }
  .row-avatar{ width:36px; height:36px; border-radius:50%; object-fit:cover; background:var(--panel-2); display:flex;align-items:center;justify-content:center; font-size:13px; color:var(--gold); font-family:'Fraunces',serif;}
  .row-title{ font-size:14.5px; font-weight:600; }
  .row-sub{ font-size:12px; color:var(--text-dim); }
  .row-right{ display:flex; align-items:center; gap:8px; }
  .pill{ padding:5px 10px; border-radius:100px; font-size:12px; font-weight:600; }
  .pill.on{ background: var(--teal-soft); color:var(--teal); }
  .pill.off{ background: var(--red-soft); color:var(--red); }

  .toggle{
    width:46px; height:26px; border-radius:100px; background: var(--panel-2); border:1px solid var(--line);
    position:relative; cursor:pointer; flex:0 0 auto;
  }
  .toggle.on{ background: var(--teal-soft); border-color: rgba(63,174,140,0.5); }
  .toggle-dot{ position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background: var(--text-dimmer); transition: all .2s ease; }
  .toggle.on .toggle-dot{ left:22px; background: var(--teal); }

  .stepper{ display:flex; align-items:center; gap:8px; }
  .stepper button{
    width:26px; height:26px; border-radius:8px; border:1px solid var(--line); background:var(--panel-2); color:var(--text);
    font-size:15px; cursor:pointer; line-height:1;
  }
  .stepper .val{ width:20px; text-align:center; font-weight:600; }

  .card-box{ background: var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:16px; }
  .row-form{ display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
  .row-form .field{ flex:1; min-width:120px; margin-bottom:0; }

  .empty{ text-align:center; color:var(--text-dim); padding:40px 10px; font-size:14px; }

  .modal-bg{
    position:fixed; inset:0; background: rgba(0,0,0,0.55); backdrop-filter: blur(3px); display:flex; align-items:flex-end;
    justify-content:center; z-index:50;
  }
  @media (min-width:600px){ .modal-bg{ align-items:center; } }
  .modal{
    background: var(--panel-2); border:1px solid var(--line); border-radius:22px 22px 0 0; padding:22px; width:100%; max-width:420px;
    max-height:85vh; overflow-y:auto;
  }
  @media (min-width:600px){ .modal{ border-radius:20px; } }
  .modal-title{ font-family:'Fraunces',serif; font-size:19px; font-weight:600; margin:0 0 16px; }
  .photo-pick{
    width:84px; height:84px; border-radius:50%; border:1.5px dashed var(--line); display:flex; align-items:center; justify-content:center;
    color:var(--text-dim); font-size:12px; cursor:pointer; margin:0 auto 16px; overflow:hidden; background:var(--panel);
  }
  .photo-pick img{ width:100%; height:100%; object-fit:cover; }
  .modal-actions{ display:flex; gap:10px; margin-top:18px; }
  .modal-actions .btn{ flex:1; }

  .notif-item{ background: var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:8px; }
  .notif-date{ font-size:11px; color:var(--text-dimmer); margin-bottom:4px; }
  .notif-msg{ font-size:14px; }

  .footer-note{ text-align:center; color:var(--text-dimmer); font-size:12px; margin-top:30px; }

  ::selection{ background: var(--gold-soft); }
</style>
</head>
<body>
<div class="orb orb1"></div>
<div class="orb orb2"></div>

<div id="root"></div>

<script>
const { storage } = window;

/* ---------------- state ---------------- */
let state = {
  loaded:false,
  config: null,        // {password}
  members: [],          // [{id,name,photo,joined}]
  meals: {},             // {date:{memberId:count}}
  deposits: {},          // {memberId:[{id,date,amount,note}]}
  expenses: [],           // [{id,date,amount,note}]
  adjustments: {},        // {memberId:[{id,date,amount,note}]}
  notifications: {},      // {memberId:[{id,date,message}]}
  session: null,           // 'manager' | 'member:<id>' | null
  view: 'members',
  todayDate: new Date().toISOString().slice(0,10),
  flippedCard: null,
  modal: null,             // {type:...}
  loginError: '',
  setupMode: false
};

function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){
  const dt = new Date(d+'T00:00:00');
  return dt.toLocaleDateString('bn-BD',{day:'numeric',month:'short'});
}
function money(n){
  n = Math.round((n||0)*100)/100;
  return '৳' + n.toLocaleString('en-US',{maximumFractionDigits:2});
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

async function loadAll(){
  try{
    const keys = ['config','members','meals','deposits','expenses','adjustments','notifications'];
    for(const k of keys){
      try{
        const r = await storage.get(k, true);
        if(r && r.value !== undefined){
          state[k] = JSON.parse(r.value);
        }
      }catch(e){ /* key not found yet, keep default */ }
    }
  }catch(e){ console.error('load error', e); }
  state.loaded = true;
  render();
}

async function save(key){
  try{
    await storage.set(key, JSON.stringify(state[key]), true);
  }catch(e){ console.error('save error', key, e); }
}

/* ---------------- derived calculations ---------------- */
function totalExpense(){ return state.expenses.reduce((s,e)=>s+Number(e.amount||0),0); }
function totalMealsCount(){
  let t=0;
  Object.values(state.meals).forEach(day=>{
    Object.values(day).forEach(c=>{ t += Number(c||0); });
  });
  return t;
}
function mealRate(){
  const tm = totalMealsCount();
  return tm>0 ? totalExpense()/tm : 0;
}
function memberMeals(id){
  let t=0;
  Object.values(state.meals).forEach(day=>{ t += Number(day[id]||0); });
  return t;
}
function memberDeposits(id){
  return (state.deposits[id]||[]).reduce((s,d)=>s+Number(d.amount||0),0);
}
function memberAdjust(id){
  return (state.adjustments[id]||[]).reduce((s,d)=>s+Number(d.amount||0),0);
}
function memberCost(id){
  return memberMeals(id) * mealRate();
}
function memberBalance(id){
  return memberDeposits(id) + memberAdjust(id) - memberCost(id);
}

/* ---------------- actions ---------------- */
async function doSetupPassword(pw){
  state.config = { password: pw };
  await save('config');
  state.session = 'manager';
  state.loginError='';
  render();
}
async function doLogin(pw){
  if(state.config && pw === state.config.password){
    state.session = 'manager';
    state.loginError = '';
  } else {
    state.loginError = 'ভুল পাসওয়ার্ড, আবার চেষ্টা করুন';
  }
  render();
}
function doLogout(){ state.session = null; state.view='members'; render(); }

async function addMember(name, photo){
  const m = { id: uid(), name, photo: photo||null, joined: todayStr() };
  state.members.push(m);
  await save('members');
  render();
}
async function updateMember(id, name, photo){
  const m = state.members.find(x=>x.id===id);
  if(m){ m.name=name; if(photo) m.photo=photo; }
  await save('members');
  render();
}
async function deleteMember(id){
  state.members = state.members.filter(m=>m.id!==id);
  await save('members');
  state.modal=null;
  render();
}

async function setMealCount(date, memberId, count){
  if(!state.meals[date]) state.meals[date] = {};
  state.meals[date][memberId] = Math.max(0, count);
  await save('meals');
  render();
}

async function addDeposit(memberId, amount, note){
  if(!state.deposits[memberId]) state.deposits[memberId]=[];
  state.deposits[memberId].push({id:uid(), date:todayStr(), amount:Number(amount), note:note||''});
  await save('deposits');
  render();
}
async function addExpense(amount, note, date){
  state.expenses.push({id:uid(), date:date||todayStr(), amount:Number(amount), note:note||''});
  await save('expenses');
  render();
}
async function deleteExpense(id){
  state.expenses = state.expenses.filter(e=>e.id!==id);
  await save('expenses');
  render();
}
async function addAdjustment(memberId, amount, note){
  if(!state.adjustments[memberId]) state.adjustments[memberId]=[];
  state.adjustments[memberId].push({id:uid(), date:todayStr(), amount:Number(amount), note:note||''});
  await save('adjustments');
  render();
}
async function sendNotification(memberId, message){
  if(!state.notifications[memberId]) state.notifications[memberId]=[];
  state.notifications[memberId].unshift({id:uid(), date: new Date().toISOString(), message});
  await save('notifications');
  render();
}

/* ---------------- render helpers ---------------- */
function el(html){
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

function initials(name){
  return (name||'?').trim().charAt(0).toUpperCase();
}

/* ---------------- views ---------------- */
function renderGate(){
  const root = document.getElementById('root');
  const needsSetup = !state.config;
  root.innerHTML = `
    <div class="gate">
      <div class="gate-card">
        <div class="gate-eyebrow">মেস ম্যানেজমেন্ট</div>
        <h1 class="gate-title">${needsSetup ? 'শুরু করুন' : 'ম্যানেজার লগইন'}</h1>
        <p class="gate-sub">${needsSetup ? 'ম্যানেজারের জন্য একটি পাসওয়ার্ড সেট করুন। এই পাসওয়ার্ড দিয়েই মেসের হিসাব নিয়ন্ত্রণ করা যাবে।' : 'পাসওয়ার্ড দিয়ে প্রবেশ করুন এবং মেসের হিসাব পরিচালনা করুন।'}</p>
        <div class="field">
          <label>পাসওয়ার্ড</label>
          <input type="password" id="pw-input" placeholder="পাসওয়ার্ড লিখুন" autocomplete="off" />
        </div>
        <div class="err">${state.loginError}</div>
        <button class="btn block ${needsSetup?'gold':''}" id="pw-submit">${needsSetup ? 'পাসওয়ার্ড সেট করুন' : 'প্রবেশ করুন'}</button>
        <div class="gate-toggle">সদস্য? <a id="member-view-link">মেম্বার ভিউ দেখুন</a></div>
      </div>
    </div>
  `;
  document.getElementById('pw-submit').onclick = ()=>{
    const v = document.getElementById('pw-input').value.trim();
    if(!v){ state.loginError='পাসওয়ার্ড লিখুন'; render(); return; }
    needsSetup ? doSetupPassword(v) : doLogin(v);
  };
  document.getElementById('pw-input').addEventListener('keydown', e=>{
    if(e.key==='Enter') document.getElementById('pw-submit').click();
  });
  document.getElementById('member-view-link').onclick = ()=>{
    state.session = 'memberpick';
    render();
  };
}

function renderMemberPick(){
  const root = document.getElementById('root');
  root.innerHTML = `
    <div class="gate">
      <div class="gate-card">
        <div class="gate-eyebrow">মেম্বার ভিউ</div>
        <h1 class="gate-title">আপনি কে?</h1>
        <p class="gate-sub">নিজের নাম নির্বাচন করে আপনার মিল, জমা ও নোটিফিকেশন দেখুন।</p>
        <div class="list" id="mp-list" style="margin-bottom:16px;"></div>
        <div class="gate-toggle"><a id="back-login">ম্যানেজার লগইনে ফিরে যান</a></div>
      </div>
    </div>
  `;
  const list = document.getElementById('mp-list');
  if(state.members.length===0){
    list.innerHTML = `<div class="empty" style="padding:10px 0;">কোনো সদস্য যোগ করা হয়নি</div>`;
  }
  state.members.forEach(m=>{
    const row = el(`
      <div class="row-card" style="cursor:pointer;">
        <div class="row-left">
          <div class="row-avatar">${m.photo?`<img src="${m.photo}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`:initials(m.name)}</div>
          <div class="row-title">${m.name}</div>
        </div>
        <div class="row-right">→</div>
      </div>
    `);
    row.onclick = ()=>{ state.session = 'member:'+m.id; render(); };
    list.appendChild(row);
  });
  document.getElementById('back-login').onclick = ()=>{ state.session=null; render(); };
}

function renderTopbar(container, roleLabel){
  const bar = el(`
    <div class="topbar">
      <div class="brand">
        <div class="brand-mark">ম</div>
        <div>
          <div class="brand-name">মেস ম্যানেজার</div>
          <div class="brand-role">${roleLabel}</div>
        </div>
      </div>
      <div class="top-actions">
        <button class="btn ghost sm" id="logout-btn">লগআউট</button>
      </div>
    </div>
  `);
  container.appendChild(bar);
  bar.querySelector('#logout-btn').onclick = doLogout;
}

/* ------- Manager App ------- */
function renderManagerApp(){
  const root = document.getElementById('root');
  root.innerHTML = '';
  const app = el(`<div class="app"></div>`);
  root.appendChild(app);
  renderTopbar(app, 'ম্যানেজার');

  const tabs = [
    ['members','সদস্য'],
    ['meals','মিল এন্ট্রি'],
    ['bazar','বাজার খরচ'],
    ['deposits','জমা'],
    ['reports','হিসাব'],
    ['notify','নোটিফিকেশন'],
  ];
  const tabsEl = el(`<div class="tabs"></div>`);
  tabs.forEach(([key,label])=>{
    const t = el(`<div class="tab ${state.view===key?'active':''}">${label}</div>`);
    t.onclick = ()=>{ state.view = key; state.flippedCard=null; render(); };
    tabsEl.appendChild(t);
  });
  app.appendChild(tabsEl);

  const body = el(`<div></div>`);
  app.appendChild(body);

  if(state.view==='members') renderMembersView(body, true);
  else if(state.view==='meals') renderMealsView(body);
  else if(state.view==='bazar') renderBazarView(body);
  else if(state.view==='deposits') renderDepositsView(body);
  else if(state.view==='reports') renderReportsView(body);
  else if(state.view==='notify') renderNotifyView(body);

  if(state.modal) renderModal(app);
}

    const row = el(`

          <div class="val">${count}</div>
          <button class="plus">+</button>
        </div>
      </div>
    `);
    row.querySelector('.minus').onclick = ()=> setMealCount(state.todayDate, m.id, count-1>=0? (count*2-count-1<0?0:count-1):0);

/* ------- Modals ------- */
function renderModal(app){
  const bg = el(`<div class="modal-bg"></div>`);
  bg.onclick = (e)=>{ if(e.target===bg){ state.modal=null; render(); } };
  const modal = el(`<div class="modal"></div>`);
  bg.appendChild(modal);

  const m = state.modal;

  if(m.type==='member'){
    const editing = m.mode==='edit';
    const mem = editing ? state.members.find(x=>x.id===m.id) : null;
    modal.innerHTML = `
      <div class="modal-title">${editing?'সদস্য এডিট করুন':'নতুন সদস্য যোগ করুন'}</div>
      <div class="photo-pick" id="photo-pick">${mem&&mem.photo?`<img src="${mem.photo}">`:'ছবি যোগ করুন'}</div>
      <input type="file" id="photo-input" accept="image/*" style="display:none;">
      <div class="field"><label>নাম</label><input type="text" id="mem-name" value="${mem?mem.name:''}" placeholder="সদস্যের নাম"></div>
      <div class="modal-actions">
        <button class="btn ghost" id="modal-cancel">বাতিল</button>
        <button class="btn gold" id="modal-save">${editing?'আপডেট করুন':'যোগ করুন'}</button>
      </div>
    `;
    let photoData = mem ? mem.photo : null;
    modal.querySelector('#photo-pick').onclick = ()=> modal.querySelector('#photo-input').click();
    modal.querySelector('#photo-input').onchange = (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = ()=>{
        photoData = reader.result;
        modal.querySelector('#photo-pick').innerHTML = `<img src="${photoData}">`;
      };
      reader.readAsDataURL(file);
    };
    modal.querySelector('#modal-cancel').onclick = ()=>{ state.modal=null; render(); };
    modal.querySelector('#modal-save').onclick = ()=>{
      const name = modal.querySelector('#mem-name').value.trim();
      if(!name) return;
      if(editing) updateMember(m.id, name, photoData);
      else addMember(name, photoData);
      state.modal=null;
    };
  }

  else if(m.type==='confirm-delete-member'){
    const mem = state.members.find(x=>x.id===m.id);
    modal.innerHTML = `
      <div class="modal-title">সদস্য মুছবেন?</div>
      <p style="color:var(--text-dim); font-size:14px;">${mem?mem.name:''} কে মুছে ফেললে তার সব হিসাব (মিল, জমা, নোটিফিকেশন) ইতিহাসে থেকে যাবে তবে তালিকা থেকে সরে যাবে।</p>
      <div class="modal-actions">
        <button class="btn ghost" id="modal-cancel">বাতিল</button>
        <button class="btn danger" id="modal-del">মুছে ফেলুন</button>
      </div>
    `;
    modal.querySelector('#modal-cancel').onclick = ()=>{ state.modal=null; render(); };
    modal.querySelector('#modal-del').onclick = ()=> deleteMember(m.id);
  }

  else if(m.type==='deposit'){
    const mem = state.members.find(x=>x.id===m.id);
    modal.innerHTML = `
      <div class="modal-title">${mem.name} — জমা যোগ করুন</div>
      <div class="field"><label>পরিমাণ (৳)</label><input type="number" id="dep-amount" placeholder="যেমন ১০০০"></div>
      <div class="field"><label>নোট (ঐচ্ছিক)</label><input type="text" id="dep-note" placeholder="যেমন নগদ জমা"></div>
      <div class="modal-actions">
        <button class="btn ghost" id="modal-cancel">বাতিল</button>
        <button class="btn gold" id="modal-save">জমা যোগ করুন</button>
      </div>
    `;
    modal.querySelector('#modal-cancel').onclick = ()=>{ state.modal=null; render(); };
    modal.querySelector('#modal-save').onclick = ()=>{
      const amt = modal.querySelector('#dep-amount').value;
      const note = modal.querySelector('#dep-note').value;
      if(!amt || Number(amt)<=0) return;
      addDeposit(m.id, amt, note);
      state.modal=null;
    };
  }

  else if(m.type==='adjust'){
    const mem = state.members.find(x=>x.id===m.id);
    modal.innerHTML = `
      <div class="modal-title">${mem.name} — এডজাস্ট করুন</div>
      <p style="color:var(--text-dim); font-size:13px; margin-top:-8px;">যোগ করতে পজিটিভ, বিয়োগ করতে নেগেটিভ সংখ্যা লিখুন</p>
      <div class="field"><label>পরিমাণ (৳)</label><input type="number" id="adj-amount" placeholder="যেমন -২০০ অথবা ২০০"></div>
      <div class="field"><label>কারণ</label><input type="text" id="adj-note" placeholder="যেমন আগের বকেয়া সমন্বয়"></div>
      <div class="modal-actions">
        <button class="btn ghost" id="modal-cancel">বাতিল</button>
        <button class="btn gold" id="modal-save">সেভ করুন</button>
      </div>
    `;
    modal.querySelector('#modal-cancel').onclick = ()=>{ state.modal=null; render(); };
    modal.querySelector('#modal-save').onclick = ()=>{
      const amt = modal.querySelector('#adj-amount').value;
      const note = modal.querySelector('#adj-note').value;
      if(amt==='' || isNaN(Number(amt))) return;
      addAdjustment(m.id, amt, note);
      state.modal=null;
    };
  }

  else if(m.type==='notify'){
    const mem = state.members.find(x=>x.id===m.id);
    modal.innerHTML = `
      <div class="modal-title">${mem.name} কে বার্তা পাঠান</div>
      <div class="field"><label>বার্তা</label><textarea id="notify-msg" rows="3" placeholder="যেমন: আগামীকাল মেসে থাকবে না তাই মিল অফ থাকবে"></textarea></div>
      <div class="modal-actions">
        <button class="btn ghost" id="modal-cancel">বাতিল</button>
        <button class="btn gold" id="modal-save">পাঠান</button>
      </div>
    `;
    modal.querySelector('#modal-cancel').onclick = ()=>{ state.modal=null; render(); };
    modal.querySelector('#modal-save').onclick = ()=>{
      const msg = modal.querySelector('#notify-msg').value.trim();
      if(!msg) return;
      sendNotification(m.id, msg);
      state.modal=null;
    };
  }

  app.appendChild(bg);
}

/* ---------------- root render ---------------- */
function render(){
  if(!state.loaded){
    document.getElementById('root').innerHTML = `<div class="gate"><div style="color:#A7A296;">লোড হচ্ছে...</div></div>`;
    return;
  }
  if(!state.session){ renderGate(); return; }
  if(state.session==='memberpick'){ renderMemberPick(); return; }
  if(state.session==='manager'){ renderManagerApp(); return; }
  if(state.session.startsWith('member:')){ renderMemberApp(state.session.split(':')[1]); return; }
  renderGate();
}

loadAll();
</script>
</body>
</html>
